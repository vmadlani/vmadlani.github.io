<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pac-man-C (Simple)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Pac-man-C (Simple Edition)</h1>
      <p class="instructions">Use arrow keys or WASD to move. Eat all pellets and avoid ghosts.</p>
      <div class="hud">
        <span id="score">Score: 0</span>
        <span id="lives">Lives: 3</span>
        <button id="restart" type="button">Restart</button>
      </div>
      <canvas id="game" width="560" height="400" aria-label="Pacman game board"></canvas>
      <p id="status" class="status">Ready!</p>
    </main>

    <script src="game.js"></script>
  </body>
</html>
